# CI gate for eval/run_retrieval.py --check. Changing these needs a commit, so it shows up in review.
production_strategy: "headers+vector"  # best Hit@3 on the first full run (88.4%), ~0.3 s/query
min_hit_at_3: 0.83                     # first measurement (88.4%) minus 5 points
max_regression_pp: 3                   # any strategy dropping more than this vs results/baseline.json fails
